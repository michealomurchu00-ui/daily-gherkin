name: Daily Gherkin Build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Configure git
        run: |
          git config user.name  "Daily Gherkin Bot"
          git config user.email "bot@daily-gherkin.local"

      - name: Run bot
        run: python3 bot.py
